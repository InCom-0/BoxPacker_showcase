<!doctypehtml>
    <html lang=en-us>

    <head>
        <meta charset=utf-8>
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no"
            name=viewport>
        <title>Dear ImGui Emscripten example</title>
        <script src=coi-serviceworker.js></script>
        <style>
            body {
                margin: 0;
                background-color: #000;
                overflow: hidden
            }

            .emscripten {
                position: absolute;
                top: 0;
                left: 0;
                margin: 0;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
                image-rendering: optimizeSpeed;
                image-rendering: -moz-crisp-edges;
                image-rendering: -o-crisp-edges;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: optimize-contrast;
                image-rendering: crisp-edges;
                -ms-interpolation-mode: nearest-neighbor
            }

            #canvas:focus {
                outline: 0
            }
        </style>
    </head>

    <body><canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        <script>var Module = { preRun: [], postRun: [], print: function (n) { n = Array.prototype.slice.call(arguments).join(" "), console.log(n) }, printErr: function (n) { n = Array.prototype.slice.call(arguments).join(" "), console.error(n) }, canvas: function () { var n = document.getElementById("canvas"); return n.addEventListener("webglcontextlost", (function (n) { alert("FIXME: WebGL context lost, please reload the page"), n.preventDefault() }), !1), n }(), setStatus: function (n) { console.log("status: " + n) }, monitorRunDependencies: function (n) { } }; window.onerror = function () { console.log("onerror: " + event) }</script>
        <script src=index.js async></script>
    </body>

    </html>
