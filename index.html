<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>BoxPacker Showcase</title><style>:root{color-scheme:light;font-family:"Iosevka Web","IBM Plex Mono",Consolas,monospace;background:radial-gradient(circle at top,#fff4d6 0,#f6e2b3 22%,#e3c77a 48%,#c49533 100%);color:#1f1607}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(720px,100%);padding:32px;border:1px solid rgba(31,22,7,.2);border-radius:24px;background:rgba(255,250,240,.82);box-shadow:0 24px 80px rgba(82,52,0,.16);backdrop-filter:blur(10px)}h1{margin:0;font-size:clamp(2rem, 4vw, 3.5rem);letter-spacing:-.04em}p{margin:12px 0 0;font-size:1rem;line-height:1.5}#status{margin-top:20px;color:#6c4c12;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}#output{margin:18px 0 0;min-height:120px;padding:18px;border-radius:16px;border:1px solid rgba(31,22,7,.14);background:rgba(255,255,255,.8);white-space:pre-wrap;word-break:break-word;font-size:1rem;line-height:1.55}#canvas{display:none}</style></head><body><main><h1>BoxPacker Showcase</h1><p>The current WebAssembly build writes standard output directly into the panel below.</p><div id=status>Loading WebAssembly module...</div><pre id=output> </pre><canvas id=canvas></canvas></main><script>const statusElement=document.getElementById("status"),outputElement=document.getElementById("output"),appendLine=t=>{outputElement.textContent.trim()||(outputElement.textContent=""),outputElement.textContent+=`${t}\n`};var Module={canvas:document.getElementById("canvas"),print(...t){const e=t.join(" ");console.log(e),appendLine(e),statusElement.textContent="Program output"},printErr(...t){const e=t.join(" ");console.error(e),appendLine(e),statusElement.textContent="Program reported an error"},setStatus(t){statusElement.textContent=t||"Ready"},onRuntimeInitialized(){outputElement.textContent.trim()||(statusElement.textContent="Ready")}};win
