<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BoxPacker Showcase</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Iosevka Web", "IBM Plex Mono", Consolas, monospace;
            background:
                radial-gradient(circle at top, #fff4d6 0%, #f6e2b3 22%, #e3c77a 48%, #c49533 100%);
            color: #1f1607;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(720px, 100%);
            padding: 32px;
            border: 1px solid rgba(31, 22, 7, 0.2);
            border-radius: 24px;
            background: rgba(255, 250, 240, 0.82);
            box-shadow: 0 24px 80px rgba(82, 52, 0, 0.16);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 12px 0 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        #status {
            margin-top: 20px;
            color: #6c4c12;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.8rem;
        }

        #output {
            margin: 18px 0 0;
            min-height: 120px;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(31, 22, 7, 0.14);
            background: rgba(255, 255, 255, 0.8);
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.55;
        }

        #canvas {
            display: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>BoxPacker Showcase</h1>
        <p>The current WebAssembly build writes standard output directly into the panel below.</p>
        <div id="status">Loading WebAssembly module...</div>
        <pre id="output"> </pre>
        <canvas id="canvas"></canvas>
    </main>
    <script>
        const statusElement = document.getElementById("status");
        const outputElement = document.getElementById("output");

        const appendLine = (text) => {
            if (!outputElement.textContent.trim()) {
                outputElement.textContent = "";
            }

            outputElement.textContent += `${text}\n`;
        };

        var Module = {
            canvas: document.getElementById("canvas"),
            print(...args) {
                const text = args.join(" ");
                console.log(text);
                appendLine(text);
                statusElement.textContent = "Program output";
            },
            printErr(...args) {
                const text = args.join(" ");
                console.error(text);
                appendLine(text);
                statusElement.textContent = "Program reported an error";
            },
            setStatus(text) {
                statusElement.textContent = text || "Ready";
            },
            onRuntimeInitialized() {
                if (!outputElement.textContent.trim()) {
                    statusElement.textContent = "Ready";
                }
            }
        };

        window.addEventListener("error", () => {
            statusElement.textContent = "An error occurred. Check the browser console.";
        });
    </script>
    {{{ SCRIPT }}}
</body>

</html>
